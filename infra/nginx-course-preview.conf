# ==============================================================================
# AVANA Production Nginx Configuration: Course Social Previews & Fastify Proxy
# ==============================================================================
#
# Production Context:
# - Active Nginx server config: /etc/nginx/sites-available/avana
# - Site document root: /var/www/avana
# - Fastify API upstream: http://127.0.0.1:3000
#
# PURPOSE:
# Routes social crawlers (Telegram, WhatsApp, Twitter, Facebook, LinkedIn, etc.)
# requesting exact canonical course URLs (/courses/:uuid) to Fastify on port 3000
# to deliver rich Open Graph and Twitter Card metadata in the initial HTML response.
#
# Normal human users continue to be served the static React SPA directly from
# /var/www/avana without any delay, without SSR overhead, and without backend load.
#
# ARCHITECTURAL DECISION & REAL NGINX CONSTRAINTS (Nginx 1.24+):
# 1. 'If is Evil' Avoidance:
#    In Nginx, combining `if ($var) { proxy_pass ...; break; }` with `try_files` inside
#    the same location is an unsafe anti-pattern that leads to unpredicted routing,
#    dropped headers, or silent 404/500 errors.
#    Here, we use the standard, battle-tested Nginx error_page pattern:
#    `error_page 418 = @course_crawler;` with `if ($is_social_crawler) { return 418; }`.
#    The `return` directive is 100% safe inside `if`, and the `=` flag ensures the
#    upstream status code from Fastify (e.g. 200, 404) replaces 418 completely.
#
# 2. Context Placement (Critical for `nginx -t`):
#    - SECTION A (`map`): MUST be placed in the `http { ... }` context
#      (recommended: /etc/nginx/conf.d/avana-crawler-map.conf).
#      Placing `map` inside a `server` block causes `nginx -t` to FAIL with:
#      `nginx: [emerg] "map" directive is not allowed here`.
#    - SECTION B (`server` directives & locations): MUST be placed inside the
#      `server { ... }` block in /etc/nginx/sites-available/avana.
# ==============================================================================


# ==============================================================================
# SECTION A: HTTP Context Configuration
# File target: /etc/nginx/conf.d/avana-crawler-map.conf
# (Automatically included by /etc/nginx/nginx.conf inside http { ... })
# ==============================================================================

map $http_user_agent $is_social_crawler {
    default 0;
    # Quoted regex ensures safe parsing across Nginx versions (including whitespace)
    "~*(telegrambot|twitterbot|facebookexternalhit|whatsapp|slackbot|vkshare|linkedinbot|embedly|quora link preview|outbrain|pinterest|skypeuripreview)" 1;
}


# ==============================================================================
# SECTION B: Server Context Configuration
# File target: Inside server { ... } block in /etc/nginx/sites-available/avana
# ==============================================================================

# Ensure document root is set to the real production site root:
# root /var/www/avana;

# ------------------------------------------------------------------------------
# 1. Social Crawler Routing for Exact Course URLs (/courses/<UUID>)
# Strictly matches valid 36-char canonical course UUIDs.
# Does NOT match /courses/explore, /courses/categories, or invalid UUIDs.
#
# - Social crawlers: Return 418 -> internally redirected to @course_crawler -> Fastify.
# - Human browsers: Fall through to try_files -> served static SPA index.html.
# ------------------------------------------------------------------------------
location ~* ^/courses/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/?$ {
    error_page 418 = @course_crawler;
    if ($is_social_crawler) {
        return 418;
    }

    # Normal human browser traffic: serve the static SPA index.html directly from /var/www/avana
    root /var/www/avana;
    try_files $uri $uri/ /index.html;
}

# Dedicated upstream proxy location for crawler course previews.
# Because proxy_pass does not contain a URI path, the original $request_uri
# (including full path and query string parameters) is passed intact to Fastify.
location @course_crawler {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_intercept_errors off;
}

# ------------------------------------------------------------------------------
# 2. Public Course Share Assets & Fallback Brand Card
# Ensures share card images and explicit share endpoints are proxied to Fastify
# ------------------------------------------------------------------------------
location ~* ^/(share/courses/|brand/avana-share-card\.png) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
}

# ------------------------------------------------------------------------------
# 3. Existing API Proxy (Preserved)
# /v1/ is proxied directly to Fastify (includes /v1/share/courses/:id/card.png)
# ------------------------------------------------------------------------------
location /v1/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    client_max_body_size 50M;
}

# ------------------------------------------------------------------------------
# 4. Standard Static SPA Fallback (Preserved)
# Handles all other client routes (/courses/explore, /courses/categories, etc.)
# ------------------------------------------------------------------------------
location / {
    root /var/www/avana;
    try_files $uri $uri/ /index.html;
}
