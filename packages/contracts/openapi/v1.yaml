components:
  securitySchemes: {}

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ModuleId:
      name: moduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    GeneratedContentId:
      name: contentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    FlashcardId:
      name: flashcardId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    QuizId:
      name: quizId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    QuizAttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: ["ok", "request_id"]
      properties:
        ok:
          type: boolean
          const: true
        request_id:
          type: string
          description: Correlation/request id propagated by API.

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: ["error", "request_id"]
      properties:
        request_id:
          type: string
        error:
          type: object
          additionalProperties: false
          required: ["code", "message"]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - unprocessable
                - internal_error
            message:
              type: string
            details:
              type: object
              additionalProperties:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: integer
                  - type: null

    Pagination:
      type: object
      additionalProperties: false
      required: ["limit", "next_cursor"]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type: string
          nullable: true

    SignInRequest:
      type: object
      additionalProperties: false
      required: ["email"]
      properties:
        email:
          type: string
          format: email
          description: Verified email address

    SignInResponse:
      type: object
      additionalProperties: false
      required: ["request_id", "user", "memberships"]
      properties:
        request_id:
          type: string
        user:
          $ref: "#/components/schemas/UserResource"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/UserMembership"

    MeResponse:
      type: object
      additionalProperties: false
      required: ["user", "memberships", "request_id"]
      properties:
        request_id:
          type: string
        user:
          $ref: "#/components/schemas/UserResource"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/UserMembership"

    UserResource:
      type: object
      additionalProperties: false
      required: ["id", "email", "role"]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            [
              student,
              teacher,
              course_editor,
              organization_admin,
              support_agent,
              platform_admin,
            ]

    UserMembership:
      type: object
      additionalProperties: false
      required: ["organization_id", "role"]
      properties:
        organization_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            [
              student,
              teacher,
              course_editor,
              organization_admin,
              support_agent,
              platform_admin,
            ]

    OrganizationResource:
      type: object
      additionalProperties: false
      required: ["id", "name"]
      properties:
        id:
