name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: avana
          POSTGRES_USER: avana
          POSTGRES_PASSWORD: avana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avana -d avana"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build internal packages
        run: npm run build:packages

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Provision isolated CI test database and role
        run: |
          PGPASSWORD=avana psql -h 127.0.0.1 -U avana -d avana -v ON_ERROR_STOP=1 <<'SQL'
            CREATE ROLE avana_exam_test_user WITH LOGIN PASSWORD 'avana_exam_test_user';
            CREATE DATABASE avana_exam_test OWNER avana_exam_test_user;
          SQL

      - name: Baseline 0071 and migrate isolated CI test database
        run: |
          npx tsx database/migrate.ts --baseline --mark-not-applicable-0071 --operator ci --reason "Fresh CI test database"
          npm run db:migrate
        env:
          MIGRATION_DATABASE_URL: postgres://avana_exam_test_user:avana_exam_test_user@127.0.0.1:5432/avana_exam_test?sslmode=disable

      # Note: DATABASE_URL is intentionally omitted in the Test step so pg-test-guard
      # enforces fail-closed isolation against TEST_DATABASE_URL only.
      # CRM (TEST_CRM_DATABASE_URL) and Poll E2E (TEST_POLL_E2E_DATABASE_URL) suites
      # require dedicated roles/databases and are excluded until provisioned in CI.
      - name: Test (default isolated PostgreSQL profile)
        run: npx vitest run --exclude apps/api/src/test/admin-crm-postgres-integration.test.ts --exclude apps/api/src/test/e2e-poll-operational-suite.test.ts --exclude database/tests/live-postgres.test.ts
        env:
          NODE_ENV: test
          AVANA_API_PORT: "0"
          TEST_DATABASE_URL: postgres://avana_exam_test_user:avana_exam_test_user@127.0.0.1:5432/avana_exam_test?sslmode=disable

      - name: Build
        run: npm run build

      - name: Secrets scan
        run: npm run secrets
