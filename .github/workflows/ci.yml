name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: avana
          POSTGRES_USER: avana
          POSTGRES_PASSWORD: avana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avana -d avana"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build internal packages
        run: npm run build:packages

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Migrate database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://avana:avana@127.0.0.1:5432/avana?sslmode=disable

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          AVANA_API_PORT: "0"
          DATABASE_URL: postgres://avana:avana@127.0.0.1:5432/avana?sslmode=disable

      - name: Build
        run: npm run build

      - name: Secrets scan
        run: npm run secrets
