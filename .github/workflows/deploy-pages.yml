name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build internal packages
        run: npm run build:packages

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Type check frontend
        run: npm run type-check --workspace=@avana/web

      - name: Build frontend
        run: npm run build --workspace=@avana/web
        env:
          # Automatically derive base path from Pages setup (e.g., /AVANA/)
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/AVANA/' }}
          # Run frontend in Demo / Public mode without backend auth dependency
          VITE_AUTH_ENABLED: "false"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
